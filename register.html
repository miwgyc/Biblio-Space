
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Biblio-Space</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .register-fields {
            display: grid;
            gap: 15px;
            margin-top: 22px;
        }

        .register-fields label {
            display: block;
            margin-bottom: 7px;
            color: #572033;
            font-weight: 600;
            font-size: 14px;
        }

        .register-fields input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #e8dcd6;
            border-radius: 8px;
            background: #fffdfb;
            color: #34252a;
            font: inherit;
        }

        .register-fields input:focus {
            outline: 2px solid #a77d78;
            border-color: #762e45;
        }

        .register-message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .register-message.error {
            color: #b42318;
        }

        .register-message.success {
            color: #267344;
        }

        .register-login {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .register-login a {
            color: #762e45;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body class="bs-page" data-page="register">

    <main class="bs-login-wrapper">
        <section class="bs-login-card">

            <a href="index.html" class="bs-back-link">
                ← Back to Homepage
            </a>

            <p class="bs-eyebrow">JOIN BIBLIO-SPACE</p>

            <h1>Create Your Account</h1>

            <p class="bs-muted">
                Register as a student to start booking your library study spaces.
            </p>

            <form id="registerForm" class="register-fields">

                <div>
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName"
                           placeholder="Enter your full name" required>
                </div>

                <div>
                    <label for="registerStudentId">Student ID</label>
                    <input type="text" id="registerStudentId"
                           placeholder="Enter your student ID" required>
                </div>

                <div>
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail"
                           placeholder="Enter your email address" required>
                </div>

                <div>
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword"
                           placeholder="Create a password"
                           minlength="6" required>
                </div>

                <div>
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           placeholder="Re-enter your password"
                           minlength="6" required>
                </div>

                <button type="submit" class="bs-button bs-full">
                    Create Account
                </button>

                <p id="registerMessage" class="register-message"></p>

            </form>

            <p class="register-login">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </section>
    </main>

    <script>
        const REGISTER_KEY = "biblioSpaceRegisteredUsers";

        const registerForm = document.getElementById("registerForm");
        const registerMessage = document.getElementById("registerMessage");

        function showMessage(message, type) {
            registerMessage.textContent = message;
            registerMessage.className = "register-message " + type;
        }

        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("registerName").value.trim();
            const studentId = document.getElementById("registerStudentId").value.trim();
            const email = document.getElementById("registerEmail").value.trim().toLowerCase();
            const password = document.getElementById("registerPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!name || !studentId || !email || !password) {
                showMessage("Please complete all fields.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            if (password.length < 6) {
                showMessage("Password must contain at least 6 characters.", "error");
                return;
            }

            let registeredUsers = [];

            try {
                registeredUsers = JSON.parse(
                    localStorage.getItem(REGISTER_KEY) || "[]"
                );

                if (!Array.isArray(registeredUsers)) {
                    registeredUsers = [];
                }

            } catch (error) {
                showMessage("Unable to read saved accounts.", "error");
                return;
            }

            const emailExists = registeredUsers.some(function(user) {
                return String(user.email || "").toLowerCase() === email;
            });

            if (emailExists) {
                showMessage("This email is already registered. Please login instead.", "error");
                return;
            }

            const studentIdExists = registeredUsers.some(function(user) {
                return String(user.studentId || "").toLowerCase() === studentId.toLowerCase();
            });

            if (studentIdExists) {
                showMessage("This Student ID is already registered.", "error");
                return;
            }

            const newUser = {
                name: name,
                studentId: studentId,
                email: email,
                password: password,
                role: "student"
            };

            registeredUsers.push(newUser);

            try {
                localStorage.setItem(
                    REGISTER_KEY,
                    JSON.stringify(registeredUsers)
                );

                const savedUsers = JSON.parse(
                    localStorage.getItem(REGISTER_KEY) || "[]"
                );

                const accountSaved = savedUsers.some(function(user) {
                    return (
                        String(user.email || "").toLowerCase() === email &&
                        user.password === password
                    );
                });

                if (!accountSaved) {
                    showMessage("Account could not be verified. Please try again.", "error");
                    return;
                }

            } catch (error) {
                showMessage("Unable to save your account. Please try again.", "error");
                return;
            }

            showMessage(
                "Registration successful! Redirecting to login...",
                "success"
            );

            registerForm.reset();

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
        });
    </script>

</body>
</html>
